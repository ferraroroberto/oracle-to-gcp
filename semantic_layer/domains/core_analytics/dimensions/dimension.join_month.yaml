id: dimension.join_month
kind: dimension
name: Join month (first purchase)
description: Month of the customer's first completed purchase. "Joined" means first purchase, not signup.
synonyms:
- join month
- month joined
- month they joined
- cohort month
- cohort
not_to_be_confused_with:
- id: dimension.signup_month
  difference: month the account was registered, which may be long before any purchase
owner:
  team: core_analytics
  steward: avery.lane
status: certified
version: 1
bindings:
- platform: legacy
  source: DWH.CUSTOMERS
  key: CUSTOMER_ID
  expression: TRUNC({t}.FIRST_PURCHASE_DATE, 'MONTH')
  preferred: false
- platform: cloud
  source: analytics.customers
  key: customer_id
  status: active
  review_note: reviewed 2026-10-03 by avery.lane
  expression: DATE_TRUNC({t}.first_purchase_date, MONTH)
