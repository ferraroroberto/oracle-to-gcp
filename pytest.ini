[pytest]
testpaths = tests
python_files = test_*.py
# Put the repo root on sys.path so tests can `from src... import ...` and
# `tests/e2e/conftest.py` can reach `tests/_streamlit_lifecycle.py`.
pythonpath = .
markers =
    windows_only: needs Windows PowerShell or other Windows-desktop state; the Mac nightly excludes it (-m "not windows_only")
