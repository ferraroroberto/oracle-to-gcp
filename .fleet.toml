# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml (schema +
# reasoning: fleet-config/architecture/README.md). Keep it current: update this
# in the same PR as any material change (layer, port, role, one-line description,
# exposed services).
#
# CLONED A NEW REPO FROM THIS SCAFFOLD? Replace the values below with your repo's
# own — at minimum `description`, usually `icon`, and `layer` if it is not a
# pipeline (working-pipe). `layer` ∈ governance | enabling | working-web | working-pipe.
display_name = "Oracle to GCP"
layer        = "working-pipe"
icon         = "☁️"
description  = "Oracle SQL → BigQuery translator prototype with mock validation."
depends_on   = ["local-llm-hub"]

# Which canonical tree the root layout is held to (project-scaffolding
# docs/repo-layout.md). Each extra root and its reason: docs/layout.md. Read by
# scripts/structure_ratchet.py; ids and presets: project-scaffolding
# docs/structure-ratchet.md.
shape       = "streamlit"
# semantic_layer: a self-contained spike with its own `python -m semantic_layer` package that must be liftable out whole, so it stays a second root.
extra_roots = ["semantic_layer"]

# Vendored byte-for-byte from project-scaffolding. sha = the source repo commit
# the copy was taken from; /propagate-vendored hash-verifies + bumps.
[vendored]
docs_ratchet = { src = "scripts/docs_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/docs_ratchet.py" }
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "bf11a867c5678c6a4869a6265bf6cecf1d12d1a2", dest = "scripts/structure_ratchet.py" }
structure_layout = { src = "scripts/structure_layout.py", sha = "1563f834338bcb5d6612dfbc2bdf2953b973fba2", dest = "scripts/structure_layout.py" }
structure_band = { src = "scripts/structure_band.py", sha = "3b708fd3c54ab7b93b08d489406c405762c83c41", dest = "scripts/structure_band.py" }
box_lock_gate = { src = "scripts/box_lock_gate.ps1", sha = "98cdb1b7727d12a5c233580478e6fae40d98e6f3", dest = "scripts/box_lock_gate.ps1" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "c5535ac326c398df8f44486f386ff0e0b6d4c61c", dest = "scripts/instruction_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "dedb86e0f212d66f247f4aacb6c15d13b1154651", dest = "scripts/doc_refs_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/dead_code_ratchet.py" }
static_ratchet = { src = "scripts/static_ratchet.py", sha = "c5535ac326c398df8f44486f386ff0e0b6d4c61c", dest = "scripts/static_ratchet.py" }
comment_ratchet = { src = "scripts/comment_ratchet.py", sha = "c5535ac326c398df8f44486f386ff0e0b6d4c61c", dest = "scripts/comment_ratchet.py" }
conventions_ratchet = { src = "scripts/conventions_ratchet.py", sha = "39ae7582b35fe8ef05441bb5cba65c38b0dfad3f", dest = "scripts/conventions_ratchet.py" }
conventions_readers = { src = "scripts/conventions_readers.py", sha = "39ae7582b35fe8ef05441bb5cba65c38b0dfad3f", dest = "scripts/conventions_readers.py" }
classify_e2e = { src = "scripts/classify_e2e.py", sha = "39ae7582b35fe8ef05441bb5cba65c38b0dfad3f", dest = "scripts/classify_e2e.py" }
runtime_write_ratchet = { src = "scripts/runtime_write_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/runtime_write_ratchet.py" }
runtime_write_resolve = { src = "scripts/runtime_write_resolve.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/runtime_write_resolve.py" }
instruction_frontmatter = { src = "scripts/instruction_frontmatter.py", sha = "c5535ac326c398df8f44486f386ff0e0b6d4c61c", dest = "scripts/instruction_frontmatter.py" }
instruction_repeats = { src = "scripts/instruction_repeats.py", sha = "c5535ac326c398df8f44486f386ff0e0b6d4c61c", dest = "scripts/instruction_repeats.py" }

# [docs_ratchet] -- the scaffold's docs ratchet. The gate (scripts/verify-before-ship.ps1)
# runs scripts/docs_ratchet.py through scripts/docs_ratchet_gate.py, which fails when
# README.md grows past 40 KiB or when README.md / docs/**/*.md gains a history marker
# (issue reference, dated or changelog heading) beyond .docs-ratchet-baseline.json. A
# check that cannot run (exit 3) is NOT CONFIRMED and fails, never a pass. Mechanism +
# limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [structure_ratchet] -- the scaffold's structure ratchet. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py, which fails when
# a file passes 1,000 lines, a Python/JS function 100 lines, a directory 40 modules, a
# src/ module imports app/, or a root folder falls outside `shape` + `extra_roots`,
# beyond .structure-ratchet-baseline.json. A check that cannot run (exit 3) is NOT
# CONFIRMED and fails, never a pass. Mechanism + limits: project-scaffolding
# docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's instruction ratchet. The gate
# (scripts/verify-before-ship.ps1) runs scripts/instruction_ratchet.py, which fails when
# a deterministic prompt-audit rule hit count in CLAUDE.md / AGENTS.md / .claude/rules /
# SKILL.md files rises above .instruction-ratchet-baseline.json, or an instruction file
# passes its size cap. A check that cannot run (exit 3) is NOT CONFIRMED and fails, never
# a pass. Mechanism + limits: project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- the scaffold's doc references ratchet. The gate
# (scripts/verify-before-ship.ps1) runs scripts/doc_refs_ratchet.py, which fails when
# README.md, CLAUDE.md or docs/**/*.md names a repo path, python -m module or relative
# link that does not exist, beyond .doc-refs-ratchet-baseline.json. No `port` is declared
# above, so loopback ports are not checked. A check that cannot run (exit 3) is NOT
# CONFIRMED and fails, never a pass. Mechanism + limits: project-scaffolding
# docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled  = true
baseline = ".doc-refs-ratchet-baseline.json"

# [dead_code_ratchet] -- the scaffold's dead code ratchet. The gate
# (scripts/verify-before-ship.ps1) runs scripts/dead_code_ratchet.py, which fails when a
# Python function, class or method that nothing in the tracked tree refers to appears
# beyond .dead-code-ratchet-baseline.json. Vendored copies are read for references but
# never reported. A check that cannot run (exit 3) is NOT CONFIRMED and fails, never a
# pass. Mechanism + limits: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [static_ratchet] -- the scaffold's static-analysis ratchet. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet.py, which fails when a
# duplicated block, an unused import or variable, or a curated ruff bug/security finding
# appears beyond .static-ratchet-baseline.json. Vendored files are left out
# automatically. A check that cannot run (exit 3: no npx, no ruff) is NOT CONFIRMED and
# fails, never a pass. Mechanism + limits: project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"

# [comment_ratchet] -- the scaffold's comment ratchet. The gate
# (scripts/verify-before-ship.ps1) runs scripts/comment_ratchet.py, which fails when a
# file carries more #NNN issue references in product-code comments than
# .comment-ratchet-baseline.json records.
# Vendored files are left out automatically. A check that cannot run (exit 3) is NOT
# CONFIRMED and fails, never a pass. Mechanism + limits: project-scaffolding
# docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's conventions ratchet. The gate
# (scripts/verify-before-ship.ps1) runs scripts/conventions_ratchet.py, which fails when a
# Python file has more hits of an enabled rule than .conventions-ratchet-baseline.json
# records. Rules enabled, each with its reason:
#   no-window         -- the app and its tests run on Windows and spawn subprocesses.
#   logging-not-print -- the project convention is `logging`, not print(), in app/ and src/.
#   no-drive-path     -- the project convention is no hardcoded paths.
# secret-compare and git-wrapper are off: the repo has no constant-time-compare or
# git-wrapper helper for them to route calls through. A check that cannot run (exit 3) is
# NOT CONFIRMED and fails, never a pass. Mechanism + limits: project-scaffolding
# docs/conventions-ratchet.md.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "logging-not-print", "no-drive-path", "subprocess-timeout"]

# A raw connect skips the row factory and, in a `with` block, never closes the file.
[[conventions_ratchet.must_use]]
call   = "sqlite3.connect"
helper = ["src/sqlite_db.py"]
why    = "src/sqlite_db.py is the one SQLite opener (row factory, transaction that closes)"

# [runtime_write_ratchet] -- scripts/runtime_write_ratchet.py fails when a tracked
# Python file gains a write target (open for writing, Path.write_*, mkdir, a log
# FileHandler, sqlite3.connect, a copy destination) whose path resolves under a code
# folder, beyond .runtime-write-ratchet-baseline.json; a new target it cannot resolve
# is "not confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file the
# run left under a code folder. Mechanism: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled      = true
baseline     = ".runtime-write-ratchet-baseline.json"
# The semantic-layer toolkit is code too (the extra root kept beside src/), not only src, app and scripts.
code_folders = ["src", "app", "scripts", "semantic_layer"]

# [e2e] -- diff-proportionate e2e routing (project-scaffolding docs/e2e-routing.md).
# scripts/classify_e2e.py loads this table and maps the changed-file set to a
# coverage tier; the pre-ship gate does not yet consume the result (no
# scripts/classify_e2e.py call in scripts/verify-before-ship.ps1), so today
# this table only drives this skill's own routed slice, not the gate's time.
# Conservative starter: only plainly inert paths (docs, the standalone
# tests/audits/ + other non-e2e tests, the self-contained semantic_layer/
# spike) are "none". app/ imports from src/ and config/ (incl. the demo data
# in data/examples/ the UI loads), so those stay unclassified and fail safe to "full".
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"

[[e2e.rule]]
tier   = "full"
prefix = "app/"
[[e2e.rule]]
tier   = "full"
prefix = "tests/e2e/"
[[e2e.rule]]
tier   = "none"
prefix = "tests/audits/"
[[e2e.rule]]
tier   = "none"
prefix = "config/audits/"
[[e2e.rule]]
tier       = "none"
prefix     = "tests/"
extensions = ["py"]
[[e2e.rule]]
tier   = "none"
prefix = "semantic_layer/"
[[e2e.rule]]
tier   = "none"
prefix = "docs/"
[[e2e.rule]]
tier       = "none"
path       = "README.md"
# The ratchet baselines: read by the gate only, never the browser -> none.
[[e2e.rule]]
tier = "none"
path = ".static-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".docs-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".structure-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".instruction-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".doc-refs-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".dead-code-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".comment-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".conventions-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".runtime-write-ratchet-baseline.json"
